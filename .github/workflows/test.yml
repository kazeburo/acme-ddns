name: test
on:
  push:
    branches:
      - "**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Instal deps
        run: |
          sudo apt install -y dnsutils libfile-which-perl libtest-tcp-perl

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v4
        with:
          go-version-file: go.mod

      - name: test
        run: |
          make check
          make

      - name: test with dig
        run: prove -r t

      - name: Snapshot GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: build --snapshot
